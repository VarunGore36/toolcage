[workspace]
resolver = "2"
members = [
  "crates/policy",
  "crates/audit",
  "crates/verify",
  "crates/cli",
  "crates/supervisor",
  "crates/proxy",
  "crates/broker",
  "crates/backend",
  "crates/backend-fc",
  "crates/backend-ns",
  "crates/backend-gv",
  "crates/guest-agent",
  "crates/capability",
  "crates/approval",
  "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
ed25519-dalek = "3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
nix = "0.31"
chacha20poly1305 = { version = "0.11", features = ["rand_core"] }
zeroize = "1"
zeroize_derive = "1"
base64 = "0.23"
rand = "0.10.3"
generic-array = "1.4"
hmac = "0.13"
