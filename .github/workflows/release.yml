name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: toolcage-cli
          path: target/release/toolcage-cli
          retention: 30 days
