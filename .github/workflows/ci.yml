name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: stable
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    # TDC-3: hosted-runner numbers are noisy (shared CPU, variable fsync);
    # the bench exists to catch ORDER-OF-MAGNITUDE regressions and prove the
    # harness runs, not to gate on exact figures. continue-on-error keeps the
    # signal visible without a red x for a noisy p99.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -p toolcage-cli -- doctor
      - run: ./scripts/bench.sh

  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.23.0
      # Fails on known VULNERABILITIES in the lockfile. Warnings
      # (unmaintained/unsound without a fix) are triaged in audit.toml with a
      # reason and a review date — the file is the ignore list of record.
      # fuzz/ is a separate workspace with its own lockfile: scan both.
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock

  cargo-deny:
    name: cargo-deny (licenses, advisories, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # Four checks in one: licenses (permissive-only allow list), advisories
      # (mirrors audit.toml), bans (duplicate versions warn), sources
      # (crates.io only). deny.toml is the exception list of record.
      # fuzz/ is a separate workspace: scanned with the same policy (its
      # libfuzzer runtime adds the NCSA allowance).
      - run: cargo deny check
      - run: cargo deny --manifest-path fuzz/Cargo.toml check

  test-results:
    name: TEST_RESULTS.md freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Fail if the doc under-counts the suite (TDC-2)
        run: |
          # Hosted runners SKIP the live Tier-0 tests, so CI's count is
          # legitimately lower than a dev host's. Fail only when the doc
          # claims FEWER tests than this runner can run — that means tests
          # landed without a doc refresh. (A higher doc count is the dev
          # host's live tests, expected.)
          stated=$(grep -oE '^[0-9]+ tests' docs/TEST_RESULTS.md | grep -oE '[0-9]+')
          actual=$(cargo test --workspace 2>&1 | grep -E "^test result" | awk '{p+=$4} END {print p+0}')
          echo "doc states ${stated}; this runner ran ${actual}"
          if [ "${stated}" -lt "${actual}" ]; then
            echo "::error::docs/TEST_RESULTS.md is stale (states ${stated}, suite has ${actual}) — run scripts/test-results.sh and commit"
            exit 1
          fi

  fuzz:
    name: fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      # fuzz/ is a separate workspace: the root fmt/build never sees it, so
      # the nightly fuzz targets could rot silently without these.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo check --manifest-path fuzz/Cargo.toml

  tier1-gvisor:
    name: Tier 1 (gVisor runsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install runsc
        run: |
          set -e
          curl -fsSL https://storage.googleapis.com/gvisor/releases/release/20250224.0/x86_64/runsc -o /tmp/runsc
          chmod a+x /tmp/runsc
          sudo mv /tmp/runsc /usr/local/bin/runsc
          runsc --version
      - name: Exercise Tier 1 gVisor driver and probe
        run: |
          cargo run --release -p toolcage-cli -- doctor
          cargo test -p toolcage-backend-gv -- --nocapture

  tier2-firecracker:
    name: Tier 2 (Firecracker KVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Firecracker & enable KVM access
        run: |
          set -e
          FC_VER="v1.10.1"
          ARCH="x86_64"
          curl -fsSL "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-${ARCH}.tgz" -o /tmp/fc.tgz
          tar -xzf /tmp/fc.tgz -C /tmp
          sudo mv "/tmp/release-${FC_VER}-${ARCH}/firecracker-${FC_VER}-${ARCH}" /usr/local/bin/firecracker
          sudo mv "/tmp/release-${FC_VER}-${ARCH}/jailer-${FC_VER}-${ARCH}" /usr/local/bin/jailer
          sudo chmod a+x /usr/local/bin/firecracker /usr/local/bin/jailer
          if [ -e /dev/kvm ]; then sudo chmod 0666 /dev/kvm || true; fi
          firecracker --version
      - name: Exercise Tier 2 Firecracker driver and warm-pool
        run: |
          cargo run --release -p toolcage-cli -- doctor
          cargo test -p toolcage-backend-fc -- --nocapture
