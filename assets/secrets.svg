<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Credential flow</title><desc id="d">The guest sends a request with a secret placeholder. The proxy checks policy, the broker injects the real credential for the bound destination only, and any echo of the secret in the response is scrubbed before the guest sees it.</desc>

<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .t{fill:#e6edf3} .m{fill:#8b949e} .d{fill:#6e7681}
  .g{fill:#3fb950} .b{fill:#58a6ff} .r{fill:#f85149} .a{fill:#d29922} .p{fill:#bc8cff}
  .h1{font-size:20px;font-weight:700} .h2{font-size:15px;font-weight:700}
  .s{font-size:12px} .xs{font-size:11px} .n{font-size:13px}
  .bold{font-weight:700}
</style>
<defs>
  <marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d29922"/></marker>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#13202e"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="999" height="499" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="42" class="t h1 sans" text-anchor="start" >Secrets never cross the boundary</text>
<text x="32" y="62" class="m n sans" text-anchor="start" >The guest only ever sees a placeholder. The real value exists on the host, for one destination.</text>
<rect x="50" y="84" width="200" height="52" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6" />
<text x="150" y="107" class="t h2 sans" text-anchor="middle" >Guest</text>
<text x="150" y="124" class="m xs mono" text-anchor="middle" >untrusted</text>
<line x1="150" y1="136" x2="150" y2="462" stroke="#30363d" stroke-width="1.4" stroke-dasharray="4 5"/>
<rect x="400" y="84" width="200" height="52" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.6" />
<text x="500" y="107" class="t h2 sans" text-anchor="middle" >Proxy + broker</text>
<text x="500" y="124" class="m xs mono" text-anchor="middle" >host, trusted</text>
<line x1="500" y1="136" x2="500" y2="462" stroke="#30363d" stroke-width="1.4" stroke-dasharray="4 5"/>
<rect x="750" y="84" width="200" height="52" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="1.6" />
<text x="850" y="107" class="t h2 sans" text-anchor="middle" >Upstream API</text>
<text x="850" y="124" class="m xs mono" text-anchor="middle" >api.github.com</text>
<line x1="850" y1="136" x2="850" y2="462" stroke="#30363d" stroke-width="1.4" stroke-dasharray="4 5"/>
<circle cx="26" cy="170" r="10" fill="#58a6ff"/><text x="26" y="174" class="sans xs bold" text-anchor="middle" fill="#0d1117">1</text>
<line x1="150" y1="170" x2="496" y2="170" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#ab)"/>
<text x="323" y="150" class="t s mono" text-anchor="middle" >GET /repos/acme/app/issues/1</text>
<text x="323" y="164" class="b s mono" text-anchor="middle" >Authorization: secret:github_token</text>
<circle cx="26" cy="218" r="10" fill="#3fb950"/><text x="26" y="222" class="sans xs bold" text-anchor="middle" fill="#0d1117">2</text>
<rect x="380" y="200" width="240" height="36" rx="8" fill="#1c2230" stroke="#3fb950" stroke-width="1.2" />
<text x="500" y="215" class="g xs mono" text-anchor="middle" >policy: host + method + path  ✓</text>
<text x="500" y="229" class="g xs mono" text-anchor="middle" >broker: credential bound to github</text>
<circle cx="26" cy="284" r="10" fill="#3fb950"/><text x="26" y="288" class="sans xs bold" text-anchor="middle" fill="#0d1117">3</text>
<line x1="504" y1="284" x2="846" y2="284" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="675" y="264" class="t s mono" text-anchor="middle" >GET /repos/acme/app/issues/1</text>
<text x="675" y="278" class="g s mono" text-anchor="middle" >Authorization: Bearer ••••••••</text>
<circle cx="26" cy="338" r="10" fill="#8b949e"/><text x="26" y="342" class="sans xs bold" text-anchor="middle" fill="#0d1117">4</text>
<line x1="846" y1="338" x2="504" y2="338" stroke="#8b949e" stroke-width="1.6" marker-end="url(#am)"/>
<text x="675" y="318" class="t s mono" text-anchor="middle" >200 OK</text>
<text x="675" y="332" class="a s mono" text-anchor="middle" >body echoes the token</text>
<circle cx="26" cy="380" r="10" fill="#3fb950"/><text x="26" y="384" class="sans xs bold" text-anchor="middle" fill="#0d1117">5</text>
<rect x="380" y="364" width="240" height="32" rx="8" fill="#1c2230" stroke="#d29922" stroke-width="1.2" />
<text x="500" y="384" class="a xs mono" text-anchor="middle" >scrub echoes → [REDACTED]</text>
<circle cx="26" cy="432" r="10" fill="#58a6ff"/><text x="26" y="436" class="sans xs bold" text-anchor="middle" fill="#0d1117">6</text>
<line x1="496" y1="432" x2="154" y2="432" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#ab)"/>
<text x="325" y="412" class="t s mono" text-anchor="middle" >200 OK</text>
<text x="325" y="426" class="b s mono" text-anchor="middle" >auth=[REDACTED]</text>
<rect x="32" y="456" width="936" height="30" rx="10" fill="none" stroke="none" stroke-width="1.2" />
<text x="500" y="482" class="m xs sans" text-anchor="middle" >Guest memory, env, args and files never contain the secret value. Literal values in env_refs are rejected.</text>
</svg>
