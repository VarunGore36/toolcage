<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">How a tool call is handled</title><desc id="d">Agent tool calls pass through the supervisor (canonicalize, policy, token, approval, log intent), then run in an isolated guest. The guest can only reach the network through the egress proxy, and the credential broker injects secrets on the host side.</desc>

<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .t{fill:#e6edf3} .m{fill:#8b949e} .d{fill:#6e7681}
  .g{fill:#3fb950} .b{fill:#58a6ff} .r{fill:#f85149} .a{fill:#d29922} .p{fill:#bc8cff}
  .h1{font-size:20px;font-weight:700} .h2{font-size:15px;font-weight:700}
  .s{font-size:12px} .xs{font-size:11px} .n{font-size:13px}
  .bold{font-weight:700}
</style>
<defs>
  <marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d29922"/></marker>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#13202e"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="999" height="609" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="42" class="t h1 sans" text-anchor="start" >How a tool call is handled</text>
<text x="32" y="62" class="m n sans" text-anchor="start" >One small trusted core decides, records, isolates, proxies and proves.</text>
<rect x="32" y="92" width="150" height="96" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.2" stroke-dasharray="6 5" />
<text x="107" y="124" class="t h2 sans" text-anchor="middle" >Agent / model</text>
<text x="107" y="145" class="m s sans" text-anchor="middle" >tool &amp; MCP output</text>
<text x="107" y="162" class="m s sans" text-anchor="middle" >web, files, email</text>
<text x="107" y="180" class="r xs mono bold" text-anchor="middle" >UNTRUSTED</text>
<line x1="182" y1="140" x2="228" y2="140" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#ab)"/>
<text x="205" y="130" class="b xs mono" text-anchor="middle" >call</text>
<rect x="230" y="82" width="540" height="126" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.8" />
<text x="248" y="106" class="g s mono bold" text-anchor="start" >SUPERVISOR</text>
<text x="334" y="106" class="m s sans" text-anchor="start" >trusted core</text>
<rect x="246" y="120" width="94" height="70" rx="8" fill="#1c2230" stroke="#30363d" stroke-width="1.2" />
<circle cx="262" cy="138" r="9" fill="#3fb950"/>
<text x="262" y="142" class="sans xs bold" text-anchor="middle" fill="#0d1117">1</text>
<text x="293" y="166" class="t n sans bold" text-anchor="middle" >Canonicalize</text>
<text x="293" y="182" class="m xs sans" text-anchor="middle" >paths · hosts</text>
<line x1="340" y1="155" x2="350" y2="155" stroke="#8b949e" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="350" y="120" width="94" height="70" rx="8" fill="#1c2230" stroke="#30363d" stroke-width="1.2" />
<circle cx="366" cy="138" r="9" fill="#3fb950"/>
<text x="366" y="142" class="sans xs bold" text-anchor="middle" fill="#0d1117">2</text>
<text x="397" y="166" class="t n sans bold" text-anchor="middle" >Policy</text>
<text x="397" y="182" class="m xs sans" text-anchor="middle" >forbid wins</text>
<line x1="444" y1="155" x2="454" y2="155" stroke="#8b949e" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="454" y="120" width="94" height="70" rx="8" fill="#1c2230" stroke="#30363d" stroke-width="1.2" />
<circle cx="470" cy="138" r="9" fill="#3fb950"/>
<text x="470" y="142" class="sans xs bold" text-anchor="middle" fill="#0d1117">3</text>
<text x="501" y="166" class="t n sans bold" text-anchor="middle" >Token</text>
<text x="501" y="182" class="m xs sans" text-anchor="middle" >narrow-only</text>
<line x1="548" y1="155" x2="558" y2="155" stroke="#8b949e" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="558" y="120" width="94" height="70" rx="8" fill="#1c2230" stroke="#30363d" stroke-width="1.2" />
<circle cx="574" cy="138" r="9" fill="#3fb950"/>
<text x="574" y="142" class="sans xs bold" text-anchor="middle" fill="#0d1117">4</text>
<text x="605" y="166" class="t n sans bold" text-anchor="middle" >Approval</text>
<text x="605" y="182" class="m xs sans" text-anchor="middle" >timeout = deny</text>
<line x1="652" y1="155" x2="662" y2="155" stroke="#8b949e" stroke-width="1.2" marker-end="url(#am)"/>
<rect x="662" y="120" width="94" height="70" rx="8" fill="#1c2230" stroke="#bc8cff" stroke-width="1.2" />
<circle cx="678" cy="138" r="9" fill="#bc8cff"/>
<text x="678" y="142" class="sans xs bold" text-anchor="middle" fill="#0d1117">5</text>
<text x="709" y="166" class="t n sans bold" text-anchor="middle" >Log intent</text>
<text x="709" y="182" class="m xs sans" text-anchor="middle" >write-ahead</text>
<rect x="804" y="92" width="164" height="106" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.2" />
<text x="886" y="116" class="t h2 sans" text-anchor="middle" >Audit log</text>
<rect x="822" y="128" width="128" height="11" rx="3" fill="#1c2230" stroke="#bc8cff" stroke-width="0.8" />
<rect x="822" y="143" width="128" height="11" rx="3" fill="#1c2230" stroke="#bc8cff" stroke-width="0.8" />
<rect x="822" y="158" width="128" height="11" rx="3" fill="#1c2230" stroke="#bc8cff" stroke-width="0.8" />
<text x="886" y="188" class="p xs mono" text-anchor="middle" >hash chain + Ed25519</text>
<line x1="770" y1="145" x2="804" y2="145" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#am)"/>
<text x="787" y="136" class="p xs mono" text-anchor="middle" >log</text>
<rect x="32" y="268" width="290" height="128" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.2" />
<text x="177" y="294" class="t h2 sans" text-anchor="middle" >Isolated guest</text>
<text x="177" y="314" class="m s sans" text-anchor="middle" >Tier 0 namespaces · Tier 1 gVisor</text>
<text x="177" y="330" class="m s sans" text-anchor="middle" >Tier 2 Firecracker</text>
<rect x="62" y="346" width="230" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.2" />
<text x="177" y="367" class="b s mono" text-anchor="middle" >AUTH=secret:github_token</text>
<rect x="372" y="268" width="250" height="128" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.2" />
<text x="497" y="294" class="t h2 sans" text-anchor="middle" >Egress proxy</text>
<text x="497" y="316" class="m s sans" text-anchor="middle" >host + method + path</text>
<text x="497" y="332" class="m s sans" text-anchor="middle" >byte / request budgets</text>
<text x="497" y="348" class="m s sans" text-anchor="middle" >DNS resolved here only</text>
<text x="497" y="380" class="a xs mono" text-anchor="middle" >the only thing that dials out</text>
<rect x="672" y="268" width="296" height="128" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.2" />
<text x="820" y="294" class="t h2 sans" text-anchor="middle" >Credential broker</text>
<text x="820" y="316" class="m s sans" text-anchor="middle" >secrets encrypted at rest</text>
<text x="820" y="332" class="m s sans" text-anchor="middle" >injects only for bound destinations</text>
<text x="820" y="348" class="m s sans" text-anchor="middle" >scrubs echoed secrets from replies</text>
<text x="820" y="380" class="g xs mono bold" text-anchor="middle" >HOST ONLY</text>
<path d="M 300 208 V 238 H 177 V 266" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
<text x="290" y="230" class="g xs mono" text-anchor="end" >spawn at tier ≥ min_isolation</text>
<path d="M 497 208 V 266" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
<path d="M 700 208 V 238 H 820 V 266" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
<line x1="322" y1="332" x2="370" y2="332" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#ab)"/>
<text x="346" y="322" class="b xs mono" text-anchor="middle" >vsock</text>
<line x1="672" y1="332" x2="624" y2="332" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ag)"/>
<text x="648" y="322" class="g xs mono" text-anchor="middle" >inject</text>
<rect x="372" y="486" width="250" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2" />
<text x="497" y="514" class="t h2 sans" text-anchor="middle" >Allowlisted hosts</text>
<text x="497" y="534" class="m s mono" text-anchor="middle" >api.github.com</text>
<text x="497" y="550" class="m s mono" text-anchor="middle" >registry.npmjs.org</text>
<line x1="497" y1="396" x2="497" y2="484" stroke="#d29922" stroke-width="1.6" marker-end="url(#aa)"/>
<text x="509" y="444" class="a xs mono" text-anchor="start" >request + secret</text>
<path d="M 177 396 V 524 H 370" fill="none" stroke="#f85149" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ar)"/>
<circle cx="177" cy="448" r="12" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
<line x1="171" y1="442" x2="183" y2="454" stroke="#f85149" stroke-width="2.2"/>
<line x1="183" y1="442" x2="171" y2="454" stroke="#f85149" stroke-width="2.2"/>
<text x="196" y="452" class="r s mono" text-anchor="start" >direct network: blocked</text>
<rect x="672" y="456" width="296" height="106" rx="10" fill="none" stroke="#30363d" stroke-width="1.2" stroke-dasharray="4 4" />
<text x="690" y="480" class="t n sans bold" text-anchor="start" >Three rules, no exceptions</text>
<text x="690" y="500" class="m s sans" text-anchor="start" >1  guest never dials out</text>
<text x="690" y="518" class="m s sans" text-anchor="start" >2  guest never holds a credential</text>
<text x="690" y="536" class="m s sans" text-anchor="start" >3  no action without a log entry</text>
<text x="690" y="553" class="d xs sans" text-anchor="start" >   (log write fails → action denied)</text>
</svg>
