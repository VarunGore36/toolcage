<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Terminal demo</title><desc id="d">Running a command under policy, a denied shell command, then signing and verifying the audit log, and verification failing after one byte is changed.</desc>

<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .t{fill:#e6edf3} .m{fill:#8b949e} .d{fill:#6e7681}
  .g{fill:#3fb950} .b{fill:#58a6ff} .r{fill:#f85149} .a{fill:#d29922} .p{fill:#bc8cff}
  .h1{font-size:20px;font-weight:700} .h2{font-size:15px;font-weight:700}
  .s{font-size:12px} .xs{font-size:11px} .n{font-size:13px}
  .bold{font-weight:700}
</style>
<defs>
  <marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d29922"/></marker>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#13202e"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="899" height="427" rx="14" fill="#0d1117" stroke="#30363d"/>
<rect x="0.5" y="0.5" width="899" height="44" rx="14" fill="#161b22" stroke="#30363d"/>
<rect x="0.5" y="30" width="899" height="16" fill="#161b22"/>
<line x1="1" y1="45" x2="899" y2="45" stroke="#30363d" stroke-width="1"/>
<circle cx="26" cy="23" r="6.5" fill="#f85149"/>
<circle cx="48" cy="23" r="6.5" fill="#d29922"/>
<circle cx="70" cy="23" r="6.5" fill="#3fb950"/>
<text x="450.0" y="28" class="m s mono" text-anchor="middle" >toolcage: policy, denial, tamper detection</text>
<text x="28" y="82" class="d n mono" text-anchor="start" ># $TC = ./target/release/toolcage-cli   (--policy / --audit flags omitted for width)</text>
<text x="28" y="108" class="mono n"><tspan class="g bold">$</tspan><tspan class="t" dx="8">$TC run --tier tier0 -- /bin/echo hello</tspan></text>
<text x="28" y="134" class="t n mono" text-anchor="start" >hello</text>
<text x="28" y="160" class="mono n"><tspan class="g bold">$</tspan><tspan class="t" dx="8">$TC run --tier tier0 -- sh -c 'echo pwned'</tspan></text>
<text x="28" y="186" class="r n mono bold" text-anchor="start" >denied: deny:shell</text>
<text x="28" y="212" class="mono n"><tspan class="g bold">$</tspan><tspan class="t" dx="8">$TC audit keygen --out-prefix /tmp/k</tspan></text>
<text x="28" y="238" class="mono n"><tspan class="g bold">$</tspan><tspan class="t" dx="8">$TC audit checkpoint --log /tmp/tc.jsonl --key-hex /tmp/k.secret.hex</tspan></text>
<text x="28" y="264" class="mono n"><tspan class="g bold">$</tspan><tspan class="t" dx="8">$TC audit verify --log /tmp/tc.jsonl --pubkey /tmp/k.pub.hex</tspan></text>
<text x="28" y="290" class="g n mono bold" text-anchor="start" >ok: N events, head ... (checkpoints verified)</text>
<text x="28" y="316" class="d n mono" text-anchor="start" ># flip one byte of /tmp/tc.jsonl</text>
<text x="28" y="342" class="mono n"><tspan class="g bold">$</tspan><tspan class="t" dx="8">$TC audit verify --log /tmp/tc.jsonl --pubkey /tmp/k.pub.hex</tspan></text>
<text x="28" y="368" class="r n mono bold" text-anchor="start" >error</text>
<text x="28" y="410" class="d xs sans" text-anchor="start" >Commands and outputs as documented in docs/TEST_RESULTS.md and docs/REVIEW.md. Redrawn for width.</text>
</svg>
