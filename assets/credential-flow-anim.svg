<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Credential flow animation</title>
  <desc id="desc">Guest sends placeholder, proxy checks policy, broker injects real credential, upstream responds, broker scrubs echo, guest sees redacted</desc>
  <style>
    .role { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:12px; font-weight:bold; text-anchor:middle; dominant-baseline:middle; }
    .guest { fill:#58a6ff; }
    .proxy { fill:#3fb950; }
    .upstream { fill:#8b949e; }
    .arrow { stroke:#e6edf3; stroke-width:2; fill:none; }
    .marker { fill:#e6edf3; }
    .msg { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:10px; fill:#e6edf3; text-anchor:middle; dominant-baseline:middle; }
    .secret { fill:#f85149; }
    .scrubbed { fill:#d29922; }
    .placeholder { fill:#a371f7; }
    .line { stroke:#30363d; stroke-width:1.5; stroke-dasharray="6 4"; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" class="marker"/>
    </marker>
    <marker id="arr-back" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10 0L0 5L10 10z" class="marker"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="200" fill="#0d1117"/>
  
  <!-- Role labels -->
  <text x="100" y="25" class="role guest">Guest (untrusted)</text>
  <text x="450" y="25" class="role proxy">Proxy + Broker (host, trusted)</text>
  <text x="800" y="25" class="role upstream">Upstream API</text>
  
  <!-- Vertical timeline lines -->
  <line x1="100" y1="40" x2="100" y2="190" class="line"/>
  <line x1="450" y1="40" x2="450" y2="190" class="line"/>
  <line x1="800" y1="40" x2="800" y2="190" class="line"/>
  
  <!-- Step 1: Guest sends request with placeholder -->
  <circle cx="100" cy="55" r="6" class="guest">
    <animate attributeName="r" values="6;10;6" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="50" class="msg guest" font-size="9px">1. Request</text>
  <text x="275" y="55" class="msg placeholder" opacity="0">GET /repos/acme/app/issues/1
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.5s" begin="3.5s" fill="freeze"/>
  </text>
  <text x="275" y="70" class="msg placeholder" opacity="0">Authorization: secret:github_token
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.7s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.5s" begin="3.5s" fill="freeze"/>
  </text>
  <!-- Arrow 1 -->
  <path d="M 130 55 H 320" class="arrow" marker-end="url(#arr)" stroke-dasharray="20" stroke-dashoffset="20" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.5s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" begin="0.5s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.3s" begin="3.5s" fill="freeze"/>
  </path>
  
  <!-- Step 2: Proxy checks policy, Broker injects credential -->
  <circle cx="450" cy="105" r="6" class="proxy">
    <animate attributeName="r" values="6;10;6" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <text x="450" y="100" class="msg proxy" font-size="9px">2. Policy ✓ + Inject</text>
  <text x="625" y="105" class="msg secret" opacity="0">GET /repos/acme/app/issues/1
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.5s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.5s" begin="4.5s" fill="freeze"/>
  </text>
  <text x="625" y="120" class="msg secret" opacity="0">Authorization: Bearer ghp_••••••••
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.5s" begin="4.5s" fill="freeze"/>
  </text>
  <!-- Arrow 2 -->
  <path d="M 480 105 H 680" class="arrow" marker-end="url(#arr)" stroke-dasharray="20" stroke-dashoffset="20" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" begin="1.5s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to "0" dur="0.3s" begin="4.5s" fill="freeze"/>
  </path>
  
  <!-- Step 3: Upstream responds (echoes token) -->
  <circle cx="800" cy="105" r="6" class="upstream">
    <animate attributeName="r" values="6;10;6" dur="4s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <text x="800" y="100" class="msg upstream" font-size="9px">3. Response (+ echo)</text>
  <text x="625" y="145" class="msg" opacity="0">200 OK { "token": "ghp_••••••••", ... }
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.5s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.5s" begin="5.5s" fill="freeze"/>
  </text>
  <!-- Arrow 3 (back) -->
  <path d="M 770 105 H 480" class="arrow" marker-end="url(#arr-back)" stroke-dasharray="20" stroke-dashoffset="20" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.5s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" begin="2.5s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.3s" begin="5.5s" fill="freeze"/>
  </path>
  
  <!-- Step 4: Broker scrubs echo -->
  <circle cx="450" cy="155" r="6" class="proxy">
    <animate attributeName="r" values="6;10;6" dur="4s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite" begin="3s"/>
  </circle>
  <text x="450" y="150" class="msg proxy" font-size="9px">4. Scrub echo</text>
  <text x="275" y="155" class="msg scrubbed" opacity="0">200 OK { "token": "[REDACTED]", ... }
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.5s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.5s" begin="6.5s" fill="freeze"/>
  </text>
  <!-- Arrow 4 (back) -->
  <path d="M 420 155 H 130" class="arrow" marker-end="url(#arr-back)" stroke-dasharray="20" stroke-dashoffset="20" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.5s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" begin="3.5s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" dur="0.3s" begin="6.5s" fill="freeze"/>
  </path>
  
  <!-- Step 5: Guest receives redacted response -->
  <circle cx="100" cy="155" r="6" class="guest">
    <animate attributeName="r" values="6;10;6" dur="4s" repeatCount="indefinite" begin="4s"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite" begin="4s"/>
  </circle>
  <text x="100" y="150" class="msg guest" font-size="9px">5. Receives [REDACTED]</text>
  
  <!-- Legend -->
  <g transform="translate(20, 170)">
    <rect x="0" y="0" width="860" height="24" rx="4" fill="#161b22" stroke="#30363d"/>
    <circle cx="20" cy="12" r="5" class="guest"/><text x="30" y="15" class="msg" font-size="11px">Guest never sees real secret</text>
    <circle cx="200" cy="12" r="5" class="proxy"/><text x="210" y="15" class="msg" font-size="11px">Proxy checks policy, Broker injects</text>
    <circle cx="430" cy="12" r="5" class="upstream"/><text x="440" y="15" class="msg" font-size="11px">Upstream may echo secret</text>
    <circle cx="620" cy="12" r="5" class="secret"/><text x="630" y="15" class="msg secret" font-size="11px">Real credential (host only)</text>
    <circle cx="760" cy="12" r="5" class="scrubbed"/><text x="770" y="15" class="msg scrubbed" font-size="11px">Scrubbed before guest</text>
  </g>
</svg>