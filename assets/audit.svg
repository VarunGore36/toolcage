<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Audit hash chain</title><desc id="d">Each audit event stores the hash of the previous one. Ed25519 checkpoints sign the sequence number, head hash and time. audit verify detects any edit, deletion, reordering or truncation.</desc>

<style>
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
  .t{fill:#e6edf3} .m{fill:#8b949e} .d{fill:#6e7681}
  .g{fill:#3fb950} .b{fill:#58a6ff} .r{fill:#f85149} .a{fill:#d29922} .p{fill:#bc8cff}
  .h1{font-size:20px;font-weight:700} .h2{font-size:15px;font-weight:700}
  .s{font-size:12px} .xs{font-size:11px} .n{font-size:13px}
  .bold{font-weight:700}
</style>
<defs>
  <marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d29922"/></marker>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#13202e"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="999" height="419" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="42" class="t h1 sans" text-anchor="start" >Every action leaves a receipt</text>
<text x="32" y="62" class="m n sans" text-anchor="start" >Write-ahead, hash-chained, checkpoint-signed. Illustrative values.</text>
<rect x="32" y="86" width="200" height="120" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5" />
<text x="46" y="110" class="p s mono bold" text-anchor="start" >seq #41</text>
<text x="218" y="110" class="d xs mono" text-anchor="end" >intent</text>
<text x="46" y="132" class="t n mono bold" text-anchor="start" >proc.exec</text>
<text x="46" y="158" class="d xs mono" text-anchor="start" >prev</text>
<text x="84" y="158" class="m s mono" text-anchor="start" >9f2c…01</text>
<text x="46" y="180" class="d xs mono" text-anchor="start" >hash</text>
<text x="84" y="180" class="g s mono bold" text-anchor="start" >51ab…e7</text>
<path d="M 232 176 H 275" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
<rect x="277" y="86" width="200" height="120" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5" />
<text x="291" y="110" class="p s mono bold" text-anchor="start" >seq #42</text>
<text x="463" y="110" class="d xs mono" text-anchor="end" >outcome</text>
<text x="291" y="132" class="t n mono bold" text-anchor="start" >proc.exec</text>
<text x="291" y="158" class="d xs mono" text-anchor="start" >prev</text>
<text x="329" y="158" class="m s mono" text-anchor="start" >51ab…e7</text>
<text x="291" y="180" class="d xs mono" text-anchor="start" >hash</text>
<text x="329" y="180" class="g s mono bold" text-anchor="start" >c07d…32</text>
<path d="M 477 176 H 520" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
<rect x="522" y="86" width="200" height="120" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5" />
<text x="536" y="110" class="p s mono bold" text-anchor="start" >seq #43</text>
<text x="708" y="110" class="d xs mono" text-anchor="end" >intent</text>
<text x="536" y="132" class="t n mono bold" text-anchor="start" >http.request</text>
<text x="536" y="158" class="d xs mono" text-anchor="start" >prev</text>
<text x="574" y="158" class="m s mono" text-anchor="start" >c07d…32</text>
<text x="536" y="180" class="d xs mono" text-anchor="start" >hash</text>
<text x="574" y="180" class="g s mono bold" text-anchor="start" >7be1…9a</text>
<path d="M 722 176 H 765" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ag)"/>
<rect x="767" y="86" width="200" height="120" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5" />
<text x="781" y="110" class="p s mono bold" text-anchor="start" >seq #44</text>
<text x="953" y="110" class="d xs mono" text-anchor="end" >outcome</text>
<text x="781" y="132" class="t n mono bold" text-anchor="start" >http.request</text>
<text x="781" y="158" class="d xs mono" text-anchor="start" >prev</text>
<text x="819" y="158" class="m s mono" text-anchor="start" >7be1…9a</text>
<text x="781" y="180" class="d xs mono" text-anchor="start" >hash</text>
<text x="819" y="180" class="g s mono bold" text-anchor="start" >e3f4…5c</text>
<text x="500" y="232" class="g s mono" text-anchor="middle" >hash = H(prev_hash, canonical(event))</text>
<rect x="752" y="262" width="216" height="76" rx="10" fill="#1c2230" stroke="#d29922" stroke-width="1.5" />
<text x="860" y="286" class="t h2 sans" text-anchor="middle" >Checkpoint</text>
<text x="860" y="306" class="a xs mono" text-anchor="middle" >Ed25519 over (seq, head, time)</text>
<text x="860" y="324" class="m xs sans" text-anchor="middle" >pinned public key verifies</text>
<path d="M 860 262 V 246 H 852 V 208" fill="none" stroke="#d29922" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#aa)"/>
<rect x="32" y="262" width="690" height="76" rx="10" fill="#1c2230" stroke="#30363d" stroke-width="1.2" />
<text x="50" y="286" class="t n mono bold" text-anchor="start" >audit verify</text>
<text x="50" y="308" class="g s mono" text-anchor="start" >✓ chain continuity</text>
<text x="250" y="308" class="g s mono" text-anchor="start" >✓ seq monotonic, no gaps</text>
<text x="500" y="308" class="g s mono" text-anchor="start" >✓ re-hash every event</text>
<text x="50" y="326" class="g s mono" text-anchor="start" >✓ checkpoint signatures</text>
<text x="250" y="326" class="m s mono" text-anchor="start" >old checkpoint / truncated tail fail</text>
<rect x="32" y="356" width="936" height="48" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.4" />
<text x="52" y="377" class="r n sans bold" text-anchor="start" >Edit, delete, reorder or truncate any event</text>
<text x="52" y="394" class="m s mono" text-anchor="start" >→ its hash no longer matches the next block's prev → audit verify fails</text>
<text x="948" y="386" class="d xs mono" text-anchor="end" >tamper-evident, not tamper-proof</text>
</svg>
