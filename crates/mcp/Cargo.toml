[package]
name = "toolcage-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dirs = "7"
toolcage-policy = { path = "../policy" }
toolcage-supervisor = { path = "../supervisor" }
toolcage-broker = { path = "../broker" }
toolcage-capability = { path = "../capability" }
toolcage-proxy = { path = "../proxy" }
toolcage-backend = { path = "../backend" }
toolcage-approval = { path = "../approval" }
rustls = { version = "0.21", optional = true }
rustls-pemfile = { version = "1.0", optional = true }
webpki = { version = "0.22", optional = true }

[features]
default = []
tls = ["rustls", "rustls-pemfile", "webpki"]

[dev-dependencies]
tempfile = "3"
