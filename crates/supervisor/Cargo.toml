[package]
name = "toolcage-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
toolcage-policy = { path = "../policy" }
toolcage-audit = { path = "../audit" }
toolcage-proxy = { path = "../proxy" }
toolcage-broker = { path = "../broker" }
toolcage-capability = { path = "../capability" }
toolcage-backend = { path = "../backend" }
toolcage-approval = { path = "../approval" }
notify = { version = "9", optional = true }

[features]
default = []
cedar = ["toolcage-policy/cedar"]
hot-reload = ["notify"]

[dev-dependencies]
toolcage-guest-agent = { path = "../guest-agent" }
toolcage-backend-ns = { path = "../backend-ns" }
